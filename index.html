<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a2b">
  <meta name="description" content="A simple, beautiful weather dashboard with live forecasts from Open-Meteo.">
  <title>Weather — Skydaily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#101a2b;--panel:#17243a;--panel-2:#1d2c43;--text:#f4f7fc;--muted:#a9b6ca;--line:rgba(222,233,250,.1);--blue:#8ebeff;--cyan:#91e1e3;--shadow:0 24px 70px rgba(0,0,0,.2}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 18% 0%,#203b5a 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 'DM Sans',system-ui,sans-serif}
    button,input{font:inherit}
    button{color:inherit}
    .shell{width:min(1120px,calc(100% - 40px));margin:auto;padding:36px 0 42px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:32px}
    .brand{display:flex;align-items:center;gap:12px;font:800 21px 'Manrope',sans-serif;letter-spacing:-.7px}
    .brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:linear-gradient(145deg,#8ebeff,#67d6d5);color:#142238;font-size:21px}
    .header-note{color:var(--muted);font-size:13px}
    .search-row{display:flex;gap:10px;max-width:630px;margin-bottom:22px}
    .search-box{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:0 15px;border:1px solid var(--line);border-radius:14px;background:rgba(23,36,58,.92)}
    .search-box svg{width:19px;height:19px;color:var(--muted);flex:none}
    .search-box input{width:100%;height:50px;border:0;outline:0;background:transparent;color:var(--text)}
    .search-box input::placeholder{color:#8493aa}
    .icon-button,.search-button{display:grid;place-items:center;min-width:50px;height:50px;border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;transition:background .2s,transform .2s}
    .icon-button:hover,.search-button:hover{background:#263955;transform:translateY(-1px)}
    .icon-button svg{width:20px;height:20px}
    .search-button{padding:0 20px;background:#a5d4fb;border-color:transparent;color:#12243a;font-weight:700}
    .search-button:hover{background:#c0e1fc}
    .status{min-height:23px;margin:-12px 0 14px;color:var(--muted);font-size:13px}
    .status.error{color:#ffb1ad}
    .dashboard{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}
    .card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(29,44,67,.96),rgba(22,34,54,.96));box-shadow:var(--shadow)}
    .current{position:relative;overflow:hidden;min-height:300px;padding:28px 30px}
    .current:after{position:absolute;content:'';width:270px;height:270px;right:-60px;top:-105px;border-radius:50%;background:radial-gradient(circle,rgba(142,190,255,.18),transparent 68%);pointer-events:none}
    .place-line{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14px}
    .place-line svg{width:16px;height:16px;color:var(--blue)}
    .place{color:var(--text);font-weight:700;font-size:17px}
    .date{margin-top:4px;color:var(--muted);font-size:13px}
    .current-main{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:27px}
    .temp{font:500 clamp(62px,9vw,92px)/1 'Manrope',sans-serif;letter-spacing:-7px}
    .condition{margin-top:8px;color:#c7d4e7;font-size:16px}
    .range{margin-top:9px;color:var(--muted);font-size:13px}
    .weather-icon{width:132px;height:132px;flex:none;filter:drop-shadow(0 10px 24px rgba(107,177,255,.14))}
    .metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .metric{display:flex;align-items:center;gap:12px;min-height:90px;padding:16px;border:1px solid var(--line);border-radius:17px;background:rgba(23,36,58,.7)}
    .metric-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:rgba(142,190,255,.1);color:var(--blue);flex:none}
    .metric-icon svg{width:19px;height:19px}
    .metric-label{color:var(--muted);font-size:12px}
    .metric-value{margin-top:3px;font:700 18px 'Manrope',sans-serif;letter-spacing:-.3px}
    .section-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:29px 2px 14px}
    h2{margin:0;font:700 17px 'Manrope',sans-serif;letter-spacing:-.3px}
    .section-hint{color:var(--muted);font-size:12px}
    .hourly{display:grid;grid-template-columns:repeat(8,minmax(86px,1fr));gap:10px;overflow-x:auto;padding-bottom:5px}
    .hour{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:132px;padding:14px 8px;border:1px solid var(--line);border-radius:16px;background:rgba(23,36,58,.78)}
    .hour-time{color:var(--muted);font-size:12px}
    .hour-icon{width:32px;height:32px}
    .hour-temp{font:700 16px 'Manrope',sans-serif}
    .hour-rain{color:var(--blue);font-size:11px}
    .forecast{display:grid;grid-template-columns:repeat(7,1fr);overflow:hidden}
    .day{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;border-right:1px solid var(--line);text-align:center}
    .day:last-child{border-right:0}
    .day-name{color:var(--muted);font-size:12px}
    .day-icon{width:38px;height:38px}
    .day-temps{display:flex;gap:7px;font:600 13px 'Manrope',sans-serif}
    .day-low{color:#92a1b7}
    .footer{display:flex;justify-content:space-between;gap:16px;margin-top:24px;color:#8493aa;font-size:12px}
    .footer a{color:#a7c7ec;text-decoration:none}
    .footer a:hover{text-decoration:underline}
    .loading{opacity:.55;pointer-events:none}
    @media(max-width:760px){.shell{width:min(100% - 28px,620px);padding-top:22px}.header-note{display:none}.dashboard{grid-template-columns:1fr}.current{min-height:260px;padding:23px}.weather-icon{width:112px;height:112px}.metrics{gap:9px}.metric{min-height:80px;padding:12px}.hourly{grid-template-columns:repeat(8,86px)}.forecast{grid-template-columns:repeat(7,92px);overflow-x:auto}.day{padding:15px 7px}.section-heading{margin-top:24px}}
    @media(max-width:390px){.search-row{gap:7px}.search-button{padding:0 14px}.icon-button{min-width:46px}.temp{font-size:68px}.weather-icon{width:92px;height:92px}.current-main{margin-top:22px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">☀</span> skydaily</div>
      <div class="header-note">A little clarity for whatever the day brings.</div>
    </header>

    <form class="search-row" id="search-form" role="search">
      <label class="search-box" for="city-input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="city-input" type="search" placeholder="Search for a city…" autocomplete="off" aria-label="Search for a city">
      </label>
      <button class="search-button" type="submit">Search</button>
      <button class="icon-button" id="location-button" type="button" aria-label="Use my location" title="Use my location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
      </button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div id="weather-content" class="loading" aria-busy="true">
      <section class="dashboard" aria-label="Current weather">
        <article class="card current">
          <div class="place-line">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span class="place" id="place">Loading weather…</span>
          </div>
          <div class="date" id="local-date">—</div>
          <div class="current-main">
            <div><div class="temp" id="temperature">—°</div><div class="condition" id="condition">Fetching the latest forecast</div><div class="range" id="range">High —° &nbsp;·&nbsp; Low —°</div></div>
            <div class="weather-icon" id="current-icon" aria-hidden="true"></div>
          </div>
        </article>
        <div class="metrics" aria-label="Weather details">
          <div class="metric"><span class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v11m0 0a4 4 0 1 0 4 4 4 4 0 0 0-4-4Z"/><path d="M9 7h3m-3 4h3"/></svg></span><div><div class="metric-label">Feels like</div><div class="metric-value" id="feels-like">—°</div></div></div>
          <div class="metric"><span class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11Z"/><path d="M9 15a3 3 0 0 0 3 3"/></svg></span><div><div class="metric-label">Humidity</div><div class="metric-value" id="humidity">—%</div></div></div>
          <div class="metric"><span class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8h12a3 3 0 1 0-3-3M2 12h17a3 3 0 1 1-3 3M4 16h7a3 3 0 1 1-3 3"/></svg></span><div><div class="metric-label">Wind</div><div class="metric-value" id="wind">— km/h</div></div></div>
          <div class="metric"><span class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></span><div><div class="metric-label">UV index</div><div class="metric-value" id="uv">—</div></div></div>
        </div>
      </section>

      <section aria-labelledby="hourly-title">
        <div class="section-heading"><h2 id="hourly-title">Today</h2><span class="section-hint">Hourly forecast</span></div>
        <div class="card hourly" id="hourly"></div>
      </section>
      <section aria-labelledby="forecast-title">
        <div class="section-heading"><h2 id="forecast-title">7-day forecast</h2><span class="section-hint">Next few days, at a glance</span></div>
        <div class="card forecast" id="forecast"></div>
      </section>
    </div>

    <footer class="footer"><span>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a></span><span id="updated"></span></footer>
  </main>
<script>
  const API = 'https://api.open-meteo.com/v1/forecast';
  const GEOCODE_API = 'https://geocoding-api.open-meteo.com/v1/search';
  const $ = (id) => document.getElementById(id);
  const weatherContent = $('weather-content');
  const status = $('status');
  const weatherCodes = {
    0:['Clear sky','sun'],1:['Mainly clear','sun-cloud'],2:['Partly cloudy','sun-cloud'],3:['Overcast','cloud'],
    45:['Fog','fog'],48:['Rime fog','fog'],51:['Light drizzle','rain'],53:['Drizzle','rain'],55:['Heavy drizzle','rain'],
    56:['Freezing drizzle','rain'],57:['Freezing drizzle','rain'],61:['Light rain','rain'],63:['Rain','rain'],65:['Heavy rain','rain'],
    66:['Freezing rain','rain'],67:['Freezing rain','rain'],71:['Light snow','snow'],73:['Snow','snow'],75:['Heavy snow','snow'],
    77:['Snow grains','snow'],80:['Rain showers','rain'],81:['Rain showers','rain'],82:['Heavy showers','rain'],
    85:['Snow showers','snow'],86:['Heavy snow showers','snow'],95:['Thunderstorm','storm'],96:['Thunderstorm, hail','storm'],99:['Thunderstorm, hail','storm']
  };
  const icons = {
    sun:'<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="20" fill="#FFC96B"/><g stroke="#FFC96B" stroke-width="5" stroke-linecap="round"><path d="M50 8v12M50 80v12M8 50h12m60 0h12M20.3 20.3l8.5 8.5m42.4 42.4 8.5 8.5m0-59.4-8.5 8.5M28.8 71.2l-8.5 8.5"/></g></svg>',
    'sun-cloud':'<svg viewBox="0 0 100 100" fill="none"><circle cx="62" cy="36" r="18" fill="#FFC96B"/><g stroke="#FFC96B" stroke-width="4" stroke-linecap="round"><path d="M62 7v8m0 42v8M33 36h8m42 0h8M42 16l6 6m29 29 6 6m0-41-6 6"/></g><path d="M27 72h46a13 13 0 0 0 0-26 19 19 0 0 0-36-2 14 14 0 0 0-10 28Z" fill="#D9E7F5"/></svg>',
    cloud:'<svg viewBox="0 0 100 100" fill="none"><path d="M22 72h52a16 16 0 0 0 0-32 23 23 0 0 0-44-3 18 18 0 0 0-8 35Z" fill="#CBD9E9"/><path d="M25 72h51" stroke="#A8BCD3" stroke-width="4" stroke-linecap="round"/></svg>',
    fog:'<svg viewBox="0 0 100 100" fill="none"><path d="M24 55h48a14 14 0 0 0 0-28 20 20 0 0 0-38-3 15 15 0 0 0-10 31Z" fill="#CBD9E9"/><g stroke="#91B2D3" stroke-width="5" stroke-linecap="round"><path d="M17 67h66M25 79h50M35 91h30"/></g></svg>',
    rain:'<svg viewBox="0 0 100 100" fill="none"><path d="M20 57h55a16 16 0 0 0 0-32 23 23 0 0 0-44-3 18 18 0 0 0-11 35Z" fill="#CBD9E9"/><g stroke="#77C9F5" stroke-width="5" stroke-linecap="round"><path d="m33 68-5 12m25-12-5 12m25-12-5 12"/></g></svg>',
    snow:'<svg viewBox="0 0 100 100" fill="none"><path d="M20 57h55a16 16 0 0 0 0-32 23 23 0 0 0-44-3 18 18 0 0 0-11 35Z" fill="#CBD9E9"/><g fill="#A9DDF7"><circle cx="31" cy="76" r="4"/><circle cx="51" cy="82" r="4"/><circle cx="70" cy="75" r="4"/></g></svg>',
    storm:'<svg viewBox="0 0 100 100" fill="none"><path d="M18 56h57a16 16 0 0 0 0-32 23 23 0 0 0-44-3 18 18 0 0 0-13 35Z" fill="#B8C8DB"/><path d="m51 55-16 23h13l-4 17 23-28H53l8-12Z" fill="#FFD166"/></svg>'
  };
  const conditionFor = code => weatherCodes[code] || ['Weather conditions','cloud'];
  const setStatus = (message, isError=false) => { status.textContent=message; status.classList.toggle('error',isError); };
  const tempText = value => `${Math.round(value)}°`;
  const dateLabel = value => new Date(`${value}T12:00:00Z`).toLocaleDateString(undefined,{weekday:'short',timeZone:'UTC'});
  const clockLabel = value => {
    const [hour,minute='00'] = value.split('T')[1].split(':');
    const h = Number(hour);
    return `${h % 12 || 12}${Number(minute) ? `:${minute}` : ''} ${h < 12 ? 'AM' : 'PM'}`;
  };
  const currentLabel = value => {
    const [date,time] = value.split('T');
    return `${new Date(`${date}T12:00:00Z`).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',timeZone:'UTC'})} · ${clockLabel(value)}`;
  };
  async function getWeather(latitude, longitude, placeName) {
    weatherContent.classList.add('loading');
    weatherContent.setAttribute('aria-busy','true');
    setStatus('Getting the latest forecast…');
    const params = new URLSearchParams({
      latitude,longitude,timezone:'auto',forecast_days:'7',
      current:'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m,wind_direction_10m,uv_index',
      hourly:'temperature_2m,precipitation_probability,weather_code',
      daily:'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max'
    });
    try {
      const response = await fetch(`${API}?${params}`);
      if (!response.ok) throw new Error('The weather service is unavailable right now. Please try again.');
      const data = await response.json();
      if (!data.current || !data.daily || !data.hourly) throw new Error('The forecast data was incomplete. Please try again.');
      renderWeather(data,placeName);
      setStatus('');
    } catch (error) {
      setStatus(error.message || 'Could not load weather. Check your connection and try again.',true);
    } finally {
      weatherContent.classList.remove('loading');
      weatherContent.setAttribute('aria-busy','false');
    }
  }
  function renderWeather(data, placeName) {
    const c=data.current,d=data.daily,h=data.hourly;
    const [description,icon]=conditionFor(c.weather_code);
    $('place').textContent=placeName;
    $('local-date').textContent=currentLabel(c.time);
    $('temperature').textContent=tempText(c.temperature_2m);
    $('condition').textContent=description;
    $('range').textContent=`H ${tempText(d.temperature_2m_max[0])}  ·  L ${tempText(d.temperature_2m_min[0])}`;
    $('current-icon').innerHTML=icons[icon];
    $('feels-like').textContent=tempText(c.apparent_temperature);
    $('humidity').textContent=`${c.relative_humidity_2m}%`;
    $('wind').textContent=`${Math.round(c.wind_speed_10m)} ${data.current_units.wind_speed_10m}`;
    $('uv').textContent=`${Number(c.uv_index).toFixed(1)} · ${uvLevel(c.uv_index)}`;
    const start=Math.max(0,h.time.findIndex(t=>t>=c.time));
    const hours=Array.from({length:8},(_,i)=>start+i).filter(i=>i<h.time.length);
    $('hourly').innerHTML=hours.map(i=>{
      const [_,hourIcon]=conditionFor(h.weather_code[i]);
      const rain=h.precipitation_probability?.[i];
      return `<div class="hour"><span class="hour-time">${i===start?'Now':clockLabel(h.time[i])}</span><span class="hour-icon">${icons[hourIcon]}</span><span class="hour-temp">${tempText(h.temperature_2m[i])}</span><span class="hour-rain">${rain==null?'':`${rain}% rain`}</span></div>`;
    }).join('');
    $('forecast').innerHTML=d.time.map((day,i)=>{
      const [__,dayIcon]=conditionFor(d.weather_code[i]);
      return `<div class="day"><span class="day-name">${i===0?'Today':dateLabel(day)}</span><span class="day-icon">${icons[dayIcon]}</span><span class="day-temps"><span>${tempText(d.temperature_2m_max[i])}</span><span class="day-low">${tempText(d.temperature_2m_min[i])}</span></span></div>`;
    }).join('');
    $('updated').textContent=`Local time · ${data.timezone_abbreviation || data.timezone}`;
  }
  function uvLevel(value) { return value<=2?'Low':value<=5?'Moderate':value<=7?'High':value<=10?'Very high':'Extreme'; }
  async function searchCity(name) {
    const query=name.trim();
    if (!query) { setStatus('Enter a city name to search.',true); return; }
    setStatus('Searching for your city…');
    try {
      const response=await fetch(`${GEOCODE_API}?${new URLSearchParams({name:query,count:'1',language:'en',format:'json'})}`);
      if (!response.ok) throw new Error('Could not search for that city. Please try again.');
      const result=(await response.json()).results?.[0];
      if (!result) { setStatus(`We couldn't find “${query}”. Try another city name.`,true); return; }
      const parts=[result.name,result.admin1,result.country].filter((part,index,array)=>part&&array.indexOf(part)===index);
      await getWeather(result.latitude,result.longitude,parts.join(', '));
    } catch(error) { setStatus(error.message || 'City search failed. Check your connection and try again.',true); }
  }
  $('search-form').addEventListener('submit',event=>{event.preventDefault();searchCity($('city-input').value);});
  $('location-button').addEventListener('click',()=>{
    if (!navigator.geolocation) { setStatus('Location is not supported by this browser. Search for a city instead.',true); return; }
    setStatus('Finding your location…');
    navigator.geolocation.getCurrentPosition(
      position=>getWeather(position.coords.latitude,position.coords.longitude,'Your location'),
      error=>setStatus(error.code===1?'Location permission was denied. Search for a city instead.':'Could not get your location. Search for a city instead.',true),
      {enableHighAccuracy:false,timeout:10000,maximumAge:300000}
    );
  });
  searchCity('Johannesburg');
</script>
</body>
</html>
